[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "irspec"
dynamic = ["version"]
description = "Infrared spectra for chemistry students: OMNIC .SPA and JCAMP-DX in, tidy CSVs, peak lists and report-ready figures out."
readme = "README.md"
license = { text = "MIT" }
keywords = ["infrared", "IR", "FTIR", "spectroscopy", "chemistry", "OMNIC", "SPA", "JCAMP-DX", "teaching"]
authors = [{ name = "Ali Perdekhan" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "Pillow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
]

[project.scripts]
irspec = "irspec.cli:main"

[project.optional-dependencies]
matplotlib = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irspec = ["data/*.sty", "data/*.R", "data/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "irspec.__version__" }
