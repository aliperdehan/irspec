# The tests on Linux and macOS. Tests that need a program that is not installed
# here (lualatex, R, poppler's tools, MuPDF) skip themselves; see the README.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy Pillow matplotlib
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
