# Releasing = pushing a tag vX.Y.Z (after the version bump and the CHANGELOG entry are
# on main). The tag must equal irspec.__version__. The tests run first; then the package
# is built and uploaded to PyPI by trusted publishing (no stored token): PyPI trusts this
# exact file name (publish.yml) and the environment name "pypi", so do not rename either.
name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/irspec/__init__.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v$version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
